name: daily-pipeline

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore rolling window (state + items)
        id: cache
        uses: actions/cache@v4
        with:
          path: data
          key: ai-tracking-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ai-tracking-data-${{ runner.os }}-

      - name: Cache status
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "rolling window restored from cache (previous state)"
          else
            echo "no cache — this run establishes a fresh baseline"
          fi

      - name: Fetch sources
        run: python fetch.py

      - name: Synthesize ideas (DeepSeek via OpenRouter)
        run: python ideas.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Export JSON artifact
        run: python export_json.py

      - name: Build static site
        run: |
          cd site
          npm ci
          npm run build

      - name: Commit artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/latest.json
          git commit -m "Update latest.json" || echo "no changes to commit"
          git push

      - name: Notify on failure
        if: failure() && env.NOTIFY_URL != ''
        run: |
          curl -fsS -X POST "$NOTIFY_URL" -d "AI Tracking daily pipeline FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
